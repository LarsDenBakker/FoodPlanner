services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: foodhelper
      POSTGRES_PASSWORD: foodhelper
      POSTGRES_DB: foodhelper_dev
    ports:
      - "5432:5432"
    volumes:
      - foodhelper_pgdata:/var/lib/postgresql/data

volumes:
  foodhelper_pgdata:
